services:
  rtsm-hydra-service:
    build: hydra-service/
    image: rtsm-hyrdra-service-image:latest
    ports:
      - "80:80"
    networks:
      - rtsm-hydra-net
  exporter:
    build: exporter/
    image: rtsm-hydra-exporter:latest
    ports:
      - "8000:8000"
    networks:
      - rtsm-hydra-net
    depends_on:
      - rtsm-hydra-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
        - rtsm-hydra-net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
        - rtsm-hydra-net
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
      - rtsm-grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  rtsm-hydra-net:

volumes:
  rtsm-grafana-storage:
